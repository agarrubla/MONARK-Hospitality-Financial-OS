services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: monark
      POSTGRES_PASSWORD: monark
      POSTGRES_DB: monark_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monark -d monark_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
